<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | Physio-Vision</title>
  <meta name="description" content="Sign in to your Physio-Vision account." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <nav>
    <div class="container nav-inner">
      <a href="index.html" class="logo">Physio<em>Vision</em></a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="faq.html">FAQ</a>
      </div>
      <div class="nav-right">
        <a href="#" class="btn btn-outline btn-disabled">Download</a>
      </div>
    </div>
  </nav>

  <div class="login-page">

    <!-- LEFT: ragdoll canvas -->
    <div class="login-left">
      <canvas id="ragdoll-canvas"></canvas>

      <div class="login-left-footer">
        © 2026 Physio-Vision · <a href="#">Privacy</a> · <a href="#">Terms</a>
      </div>
    </div>

    <!-- RIGHT: form -->
    <div class="login-right">
      <div class="login-form-header">
        <a href="index.html" class="logo mobile-logo">Physio<em>Vision</em></a>
        <p class="label">Welcome back</p>
        <h1>Sign in to your account</h1>
        <p>Don't have an account? <a href="signup.html">Create one for free</a></p>
      </div>

      <form id="login-form" novalidate autocomplete="off">

        <div class="form-group">
          <label for="email">Email Address</label>
          <input class="form-input" type="email" id="email" name="email"
            placeholder="jane@example.com" required autocomplete="email" />
          <span class="error-msg"></span>
        </div>

        <div class="form-group">
          <label for="password">
            Password
            <a href="#" class="forgot-link">Forgot password?</a>
          </label>
          <div class="password-wrap">
            <input class="form-input" type="password" id="password" name="password"
              placeholder="Enter your password" required autocomplete="current-password" minlength="8" />
            <button type="button" class="pw-toggle" aria-label="Toggle password visibility">
              <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <span class="error-msg"></span>
        </div>

        <div class="remember-row">
          <label class="remember-label">
            <div class="custom-checkbox">
              <input type="checkbox" id="remember" name="remember" />
              <div class="checkbox-box">
                <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
                  <path d="M1 4l3 3 5-6" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>
            <span>Remember me for 30 days</span>
          </label>
        </div>

        <button type="submit" class="btn-submit" id="btn-submit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Sign In
        </button>

        <div class="divider"><span>or continue with</span></div>

        <div class="social-row">
          <button type="button" class="btn-social">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Google
          </button>
          <button type="button" class="btn-social">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
            GitHub
          </button>
        </div>

      </form>
    </div>

  </div>

  <script src="js/login.js"></script>

</body>
</html>
